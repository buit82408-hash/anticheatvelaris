name: Build Velaris_Anticheat
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén zip nếu pom.xml chưa ở gốc repo
        run: |
          if [ ! -f pom.xml ]; then
            Z=$(find . -maxdepth 1 -name '*.zip' | head -n1)
            echo "Dùng file: $Z"
            unzip -q "$Z" -d _src
            cp -r _src/*/. .
          fi
          ls
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Kiểm thử logic lõi
        run: |
          javac -d out src/main/java/com/velaris/anticheat/core/*.java tools/CombatSim.java
          java -cp out CombatSim
      - name: Build jar
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Velaris_Anticheat
          path: target/Velaris_Anticheat.jar
